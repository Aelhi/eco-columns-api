services:
  - type: web
    name: eco-column-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn EcoAPI:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FIREBASE_CREDENTIALS
        sync: false  # This will be manually set in Render dashboard
      - key: GOOGLE_CREDENTIALS
        sync: false  # This will be manually set in Render dashboard
